# dsh-autoclaw-relay bundle patch：把插件行插进 profile 组合树。
# 作为 profile 的一层补丁应用在 dsh-base / dsh-web-app 之后。
# 行 id（dsh-autoclaw-relay）同时是 Config 页面里的设置分组键。
#
# name 必须是 package.json 的包名：loader 按包名从 profile 的 node_modules 解析
# （npm 安装 / file: 装配都走这条路）。
- insert:
    - id: dsh-autoclaw-relay
      name: 'dsh-autoclaw-relay'
